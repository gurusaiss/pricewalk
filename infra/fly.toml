# Fly.io app config for the API + worker (one app, two process groups, sharing
# one image). Run `fly launch --no-deploy` from the repo root first to create
# the app and attach this config, then `fly deploy --config infra/fly.toml`.
# See DEPLOY.md for the full walkthrough.

app = "pricewalk-api"
primary_region = "bom" # Mumbai - closest Fly region to Indian users

[build]
  dockerfile = "Dockerfile.fly"

[deploy]
  # Runs once per deploy, before the new version takes traffic.
  release_command = "alembic -c packages/core/alembic.ini upgrade head"

[env]
  ENV = "production"

[processes]
  api = "uvicorn api.main:app --host 0.0.0.0 --port 8000"
  worker = "arq worker.main.WorkerSettings"

[[services]]
  processes = ["api"]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "256mb"
