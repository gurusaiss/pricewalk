[project]
name = "pricewalk"
version = "0.1.0"
description = "PriceWalk — price tracking for Indian e-commerce"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "redis>=5.1",
    "httpx>=0.27",
    "selectolax>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools]
packages = ["core", "api", "worker"]

[tool.setuptools.package-dir]
core = "packages/core/core"
api = "services/api/api"
worker = "services/worker/worker"

[tool.pytest.ini_options]
pythonpath = ["packages/core", "services/api", "services/worker"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/core", "services/api", "services/worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages/core:services/api:services/worker"
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
